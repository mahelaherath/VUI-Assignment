name: vui_mental_health
description: A mobile VUI mental health and wellbeing support application targeted at young adults.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  permission_handler: ^11.3.1
  sqflite: ^2.3.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  fake_async: ^1.3.1
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
